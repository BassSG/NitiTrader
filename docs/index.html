<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081017">
  <meta http-equiv="refresh" content="2;url=https://script.google.com/macros/s/AKfycbwdJeQ44O2m0rTMKoZf0fnMyiqv3V0xe2qyT4-p-jDMRfWQDsmO-fBJ45xHy0ea55Oy/exec">
  <title>Niti Trader</title>
  <style>
    :root{color-scheme:dark;--bg:#081017;--panel:#101d25;--line:#29404b;--gold:#dfbd7b;--muted:#9cafba}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#17313c 0,#081017 46%,#050a0e 100%);color:#edf2f4;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{width:min(92vw,520px);padding:40px 32px;text-align:center;background:#101d25e8;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px #0008}
    .mark{width:70px;height:70px;margin:0 auto 20px;display:grid;place-items:center;border:1px solid #806a3e;border-radius:18px;background:#0b1217;box-shadow:0 0 35px #dfbd7b22}.mark img{width:56px;height:56px;object-fit:contain}
    h1{margin:0;color:var(--gold);font-size:28px;letter-spacing:.5px}p{margin:10px 0;color:var(--muted)}.status{margin:24px 0 18px;color:#6cdec1;font-size:13px}.spinner{width:26px;height:26px;margin:0 auto 10px;border:3px solid #344b50;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    a{display:inline-block;padding:12px 20px;border-radius:10px;background:var(--gold);color:#111c22;text-decoration:none;font-weight:700}small{display:block;margin-top:20px;color:#718793;font-size:11px}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark"><span style="color:#dfbd7b;font-size:42px;font-weight:800">N</span></div>
    <h1>Niti Trader</h1>
    <p>Personal Trading Intelligence Desk</p>
    <div class="status"><div class="spinner" aria-hidden="true"></div>กำลังเปิดแอป Niti Trader…</div>
    <a href="https://script.google.com/macros/s/AKfycbwdJeQ44O2m0rTMKoZf0fnMyiqv3V0xe2qyT4-p-jDMRfWQDsmO-fBJ45xHy0ea55Oy/exec">เปิดแอปทันที</a>
    <small>หน้า GitHub นี้เป็นทางเข้าสู่ Niti Trader ที่ Deploy บน Google Apps Script โดยตรง ข้อมูลและ API Key ทำงานฝั่ง GAS</small>
  </main>
</body>
</html>
